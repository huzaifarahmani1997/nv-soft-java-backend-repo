spring:
  application:
    name: nvsoftuser-service

  datasource:
    url: jdbc:h2:mem:userdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080

logging:
  file:
    name: logs/app.log
  level:
    root: INFO
    com.nv.soft.nvsoftuser: DEBUG
